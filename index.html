<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>내전 매니저</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 왼쪽 고정 사이드바 + 오른쪽 작업 영역(상단 바 + 페이지). 좁은 화면에서는 사이드바가 위쪽 가로 메뉴로 바뀜 */
:root {
  --bg-main: #050505; --bg-panel: #111111; --bg-hover: #1a1a1a; --bg-input: #000000; --bg-details: #080808;
  --text-main: #e0e0e0; --text-muted: #7e7e7e; --border: #2b2b2b;
  --accent: #eebc51; --accent-dim: rgba(238, 188, 81, .12); --accent-ink: #1a1405;
  --danger: #ff4757; --danger-dim: rgba(255, 71, 87, .13); --ok: #2ed573; --ok-dim: rgba(46, 213, 115, .13);
  --gold: #f1c40f; --silver: #bdc3c7; --bronze: #cd7f32;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --font: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"]:not([data-ui]), :root[data-ui="light"] {
  --bg-main: #f0f2f5; --bg-panel: #ffffff; --bg-hover: #f4f5f7; --bg-input: #ffffff; --bg-details: #f1f2f6;
  --text-main: #1c1e21; --text-muted: #65676b; --border: #e1e4e9;
  --accent: #d35400; --accent-dim: rgba(211, 84, 0, .1); --accent-ink: #ffffff;
  --danger: #d63031; --danger-dim: rgba(214, 48, 49, .1); --ok: #1e9e57; --ok-dim: rgba(30, 158, 87, .12);
  --gold: #c9a000; --silver: #8d969c; --bronze: #b0672a; --shadow: 0 10px 30px rgba(20, 30, 50, .14);
  color-scheme: light;
}
:root[data-ui="dark"] {
  --bg-main: #050505; --bg-panel: #111111; --bg-hover: #1a1a1a; --bg-input: #000000; --bg-details: #080808;
  --text-main: #e0e0e0; --text-muted: #7e7e7e; --border: #2b2b2b;
  --accent: #eebc51; --accent-dim: rgba(238, 188, 81, .12); --accent-ink: #1a1405;
  --danger: #ff4757; --danger-dim: rgba(255, 71, 87, .13); --ok: #2ed573; --ok-dim: rgba(46, 213, 115, .13);
  --gold: #f1c40f; --silver: #bdc3c7; --bronze: #cd7f32; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg-main); color: var(--text-main); font-family: var(--font); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.ic { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── App frame ── */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.sidebar { background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 26px 16px 18px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; justify-content: center; gap: 10px; padding-bottom: 20px; margin-bottom: 22px; border-bottom: 1px solid var(--border); color: var(--accent); font-weight: 900; font-size: 22px; letter-spacing: -0.02em; text-align: center; }
.brand .ic { width: 28px; height: 28px; stroke-width: 2.4; }
.brand-emoji { font-size: 26px; line-height: 1; }
.brand-img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex: none; display: block; }
.icon-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.icon-opt { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-muted); cursor: pointer; padding: 0; }
.icon-opt:hover { color: var(--accent); border-color: var(--accent); }
.icon-opt.on { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 0 1px var(--accent); }
.icon-opt .ic { width: 20px; height: 20px; }
.emoji-in { width: 90px; text-align: center; font-size: 18px; padding: 5px 8px; }
.emoji-in::placeholder { opacity: .3; }
.brand-preview { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 8px; }
.menu { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.menu-item { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 0; border-left: 3px solid transparent; border-radius: 4px; background: none; color: var(--text-muted); font-weight: 700; font-size: 14.5px; text-align: left; cursor: pointer; }
.menu-item:hover { background: var(--bg-hover); color: var(--text-main); }
.menu-item.active { background: var(--accent-dim); color: var(--accent); border-left-color: var(--accent); }
.menu-item .ic { width: 18px; height: 18px; }
.side-foot { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 14px; display: grid; gap: 4px; }
.access { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 12.5px; color: var(--text-muted); }
.access b { color: var(--text-main); }
.access.admin .ic { color: var(--accent); }
.made-for { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 22px 28px 18px; border-bottom: 1px solid var(--border); background: var(--bg-main); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.page-title { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.page-title .sub { font-size: 13px; font-weight: 500; color: var(--text-muted); letter-spacing: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.page { padding: 24px 28px 60px; display: grid; gap: 20px; align-content: start; }

/* ── Buttons & inputs ── */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-main); font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
a.btn { text-decoration: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.gold { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.gold:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.btn.ok:hover { background: var(--ok-dim); color: var(--ok); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
.btn.danger:hover { background: var(--danger-dim); color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
.btn.ghost:hover { color: var(--text-main); background: var(--bg-hover); }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.field { background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; min-width: 0; }
.field:focus { outline: none; border-color: var(--accent); }
textarea.field { resize: vertical; min-height: 120px; width: 100%; }
.search { position: relative; display: flex; align-items: center; }
.search .ic { position: absolute; left: 11px; color: var(--text-muted); pointer-events: none; }
.search input { padding-left: 34px; width: 220px; max-width: 100%; }
label.lbl { display: grid; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--text-muted); }

/* ── Panels ── */
.panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--bg-hover); }
.panel-head h3 { margin: 0; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.panel-head h3 .ic { color: var(--accent); }
.panel-body { padding: 16px 18px; }
.muted { color: var(--text-muted); }
.empty { padding: 34px 16px; text-align: center; color: var(--text-muted); font-size: 13.5px; }
.empty b { color: var(--text-main); }
.notice-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; background: var(--accent-dim); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-size: 13px; }
.notice-bar.warn { background: var(--danger-dim); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

/* ── Tier badges & avatars ── */
.tb { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 900; letter-spacing: .02em; background: var(--tc); color: var(--tk); white-space: nowrap; }
.av { width: 38px; height: 38px; border-radius: 50%; flex: none; overflow: hidden; display: grid; place-items: center; background: var(--bg-hover); border: 2px solid var(--border); color: var(--accent); font-weight: 900; font-size: 15px; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.tinted { background: var(--tc); color: var(--tk); border-color: color-mix(in srgb, var(--tc) 70%, var(--text-main)); }
.av.lg { width: 84px; height: 84px; font-size: 32px; border-color: var(--accent); }
.av.sm { width: 28px; height: 28px; font-size: 12px; border-width: 1px; }

/* ── Tables ── */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; color: var(--text-muted); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--bg-hover); }
.tbl .r { text-align: right; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover, .tbl th.sortable.on { color: var(--accent); }

/* ── Dashboard ── */
.live { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 22px 26px; border-radius: 12px; border: 1px solid var(--border); background: radial-gradient(120% 140% at 0% 0%, var(--accent-dim), transparent 60%), var(--bg-panel); }
.live-tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--danger); }
.live-tag i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: pulse 1.6s infinite; }
.live-tag.ready { color: var(--text-muted); }
.live-tag.ready i { animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 60%, transparent); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .live-tag i { animation: none; } }
.live h2 { margin: 6px 0 0; font-size: clamp(24px, 3.4vw, 34px); font-weight: 900; letter-spacing: -0.03em; }
.live h2 em { font-style: normal; color: var(--accent); }
.clock { font-family: var(--mono); font-size: clamp(28px, 4vw, 44px); font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.stat { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.stat-label { font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
.stat-label .ic { color: var(--accent); }
.stat-who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.stat-who .av { width: 48px; height: 48px; }
.stat-name { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat-val { font-size: 13px; color: var(--text-muted); }
.stat-big { font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1; }
.meter { height: 6px; border-radius: 3px; background: var(--bg-hover); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.dash-side { display: grid; gap: 18px; }
.rank-tbl td:first-child { width: 48px; font-weight: 900; font-size: 16px; }
.rank-tbl tr.r1 td:first-child { color: var(--gold); }
.rank-tbl tr.r2 td:first-child { color: var(--silver); }
.rank-tbl tr.r3 td:first-child { color: var(--bronze); }
.pts { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 15px; }
.gap { font-family: var(--mono); font-size: 12.5px; color: var(--danger); }
.gap.lead { color: var(--text-muted); }
.winner { text-align: center; padding: 22px 16px; }
.winner .names { color: var(--accent); font-size: 20px; font-weight: 900; line-height: 1.4; word-break: keep-all; }
.winner .when { margin-top: 8px; font-size: 12.5px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; }
.podium { display: grid; gap: 8px; padding: 14px 16px; }
.pod { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--bg-details); }
.pod .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #111; background: var(--silver); }
.pod .n.p1 { background: var(--gold); } .pod .n.p3 { background: var(--bronze); }
.pod .t { font-weight: 800; }
.pod .m { font-size: 12px; color: var(--text-muted); overflow-wrap: anywhere; }
.dist { display: grid; gap: 7px; padding: 16px 18px; }
.dist-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 28px; align-items: center; gap: 10px; font-size: 12.5px; }
.dist-bar { height: 12px; border-radius: 3px; background: var(--bg-hover); overflow: hidden; }
.dist-bar i { display: block; height: 100%; background: var(--tc); border-radius: 3px; }
.dist-row .c { text-align: right; font-family: var(--mono); color: var(--text-muted); }

/* ── Draft ── */
.draft { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
.team { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.team-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 14px; background: var(--bg-hover); border-bottom: 1px solid var(--border); }
.team-name { color: var(--accent); font-weight: 900; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.tn-edit { display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--text-muted); cursor: pointer; flex: none; }
.tn-edit:hover { color: var(--accent); background: var(--accent-dim); }
.tn-edit .ic { width: 13px; height: 13px; }
.tm-id .tn-edit { width: 20px; height: 20px; vertical-align: middle; margin-left: 2px; }
.team-info { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.team-count { font-family: var(--mono); font-weight: 700; color: var(--text-muted); }
.team-count.part { color: var(--ok); } .team-count.full { color: var(--danger); }
.team-cost { background: var(--bg-main); padding: 3px 8px; border-radius: 6px; color: var(--text-muted); }
.team-cost b { color: var(--accent); font-family: var(--mono); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px; min-height: 92px; transition: background-color .15s; }
.slots.over { background: var(--accent-dim); }
.slots.over.full { background: var(--danger-dim); }
.slot-empty { border: 1.5px dashed var(--border); border-radius: 8px; min-height: 64px; display: grid; place-items: center; color: var(--text-muted); font-size: 11.5px; cursor: pointer; }
.slot-empty:hover { border-color: var(--accent); color: var(--accent); }
.chip { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-details); cursor: grab; user-select: none; text-align: center; min-width: 0; touch-action: manipulation; }
.chip:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
.chip.dragging { opacity: .4; }
.chip.swap { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
.chip.sel { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 0 2px var(--accent); }
.chip .nm { font-weight: 800; font-size: 12.5px; line-height: 1.25; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .meta { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); }
.chip .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: transparent; color: var(--text-muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.chip .x:hover { color: var(--danger); background: var(--danger-dim); }
.chip .x .ic { width: 12px; height: 12px; }
.pool { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: sticky; top: 96px; max-height: calc(100vh - 116px); display: flex; flex-direction: column; }
.pool-scroll { overflow-y: auto; padding: 12px; display: grid; gap: 10px; }
.tier-box { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.tier-box-head { padding: 6px 10px; font-size: 12px; font-weight: 900; background: color-mix(in srgb, var(--tc) 18%, var(--bg-panel)); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.tier-box-head .tb { font-size: 10.5px; }
.tier-box-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px; min-height: 44px; transition: background-color .15s; }
.tier-box-body.over { background: var(--accent-dim); }
.selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* ── Tier board (선수 티어표) ── */
.tiers-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.tier-board { display: grid; gap: 8px; }
.tier-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg-panel); min-height: 74px; }
.tier-label { display: grid; place-content: center; justify-items: center; gap: 4px; background: var(--tc); color: var(--tk); font-weight: 900; font-size: 20px; text-align: center; padding: 8px; }
.tier-label small { font-size: 11px; font-weight: 800; background: rgba(0, 0, 0, .18); padding: 1px 8px; border-radius: 10px; }
.tier-body { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; align-content: flex-start; transition: background-color .15s; cursor: default; }
.tier-body.over, .tier-body.target { background: var(--accent-dim); }
.pcard { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-details); cursor: grab; user-select: none; font-weight: 700; font-size: 13px; max-width: 100%; }
.pcard:hover { border-color: var(--accent); }
.pcard.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--accent-dim); }
.pcard.changed { border-style: dashed; border-color: var(--accent); }
.pcard.dragging { opacity: .4; }
.pcard .av { width: 28px; height: 28px; font-size: 12px; border-width: 1px; }
.pcard span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-stack { display: grid; gap: 14px; position: sticky; top: 96px; }

/* ════════════════════════ 저장소 (공유 DB / 이 브라우저) ════════════════════════ */
class LocalDB {
  constructor(key) { this.key = key; this.s = ls.get(key, {}); this.subs = new Set(); }
  _commit() { ls.set(this.key, this.s); const subs = [...this.subs]; setTimeout(() => subs.forEach(f => f()), 0); }
  _snap(c) {
    const docs = Object.entries(this.s[c] || {}).sort(([a], [b]) => a < b ? -1 : 1)
      .map(([id, d]) => ({ id, exists: true, data: () => JSON.parse(JSON.stringify(d)) }));
    return { docs, size: docs.length, empty: !docs.length };
  }
  collection(c) {
    const self = this;
    return {
      path: c,
      doc: id => self.doc(c + "/" + (id || rid())),
      add: async d => { const r = self.doc(c + "/" + rid()); await r.set(d); return r; },
      get: async () => self._snap(c),
      onSnapshot(next) { const f = () => next(self._snap(c)); self.subs.add(f); setTimeout(f, 0); return () => self.subs.delete(f); },
    };
  }
  doc(path) {
    const self = this, [c, id] = path.split("/");
    const merge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object") merge(a[k], b[k]); else a[k] = b[k]; } return a; };
    return {
      id, path,
      get: async () => { const d = self.s[c]?.[id]; return { id, exists: !!d, data: () => d && JSON.parse(JSON.stringify(d)) }; },
      set: async d => { (self.s[c] ||= {})[id] = JSON.parse(JSON.stringify(d)); self._commit(); },
      update: async d => { if (!self.s[c]?.[id]) throw { code: "invalid_argument", message: "missing" }; merge(self.s[c][id], JSON.parse(JSON.stringify(d))); self._commit(); },
      delete: async () => { if (self.s[c]) delete self.s[c][id]; self._commit(); },
      onSnapshot(next) { const f = () => { const d = self.s[c]?.[id]; next({ id, exists: !!d, data: () => d && JSON.parse(JSON.stringify(d)) }); }; self.subs.add(f); setTimeout(f, 0); return () => self.subs.delete(f); },
    };
  }
}

/* Supabase 저장소: docs(collection, id, data) 테이블 하나에 문서를 저장하고 실시간으로 받아옴 */
const deepMerge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; };
const clone = v => JSON.parse(JSON.stringify(v));
function mapErr(e) {
  const msg = (e && e.message) || "";
  if (e && (e.code === "42501" || /row-level security|permission/i.test(msg))) return { code: "invalid_argument", message: msg };
  if (e && (e.code === "PGRST301" || /JWT|expired/i.test(msg))) return { code: "revoked", message: msg };
  return { code: (e && e.code) || "unavailable", message: msg };
}
const COLLECTIONS = ["players", "hof", "inquiries", "scores", "state"];
const DOC_ID_RE = /^[A-Za-z0-9_.:@+~-]{1,100}$/;
LocalDB.prototype.exportAll = async function () { const out = []; for (const c of COLLECTIONS) for (const [id, data] of Object.entries(this.s[c] || {})) out.push({ collection: c, id, data }); return out; };
LocalDB.prototype.replaceAll = async function (docs) { this.s = {}; for (const d of docs) (this.s[d.collection] ||= {})[d.id] = d.data; this._commit(); };
class SupaDB {
  constructor(sb) { this.sb = sb; this.cache = new Map(); this.listeners = new Map(); this.channel = null; }
  _emit(c) {
    const m = this.cache.get(c) || new Map();
    const docs = [...m.entries()].sort(([a], [b]) => a < b ? -1 : 1).map(([id, d]) => ({ id, exists: true, data: () => clone(d) }));
    const snap = { docs, size: docs.length, empty: !docs.length };
    (this.listeners.get(c) || []).forEach(f => f(snap));
  }
  async _load(c) {
    const { data, error } = await this.sb.from("docs").select("id,data").eq("collection", c).limit(5000);
    if (error) throw mapErr(error);
    this.cache.set(c, new Map(data.map(r => [r.id, r.data || {}])));
    this._emit(c);
  }
  _ensureChannel() {
    if (this.channel) return;
    this.channel = this.sb.channel("docs-live").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, pl => {
      const row = (pl.new && pl.new.collection) ? pl.new : pl.old;
      if (!row || !row.collection) return;
      const m = this.cache.get(row.collection); if (!m) return;
      if (pl.eventType === "DELETE") m.delete(row.id); else m.set(row.id, pl.new.data || {});
      this._emit(row.collection);
    }).subscribe();
  }
  refresh() { for (const c of this.listeners.keys()) this._load(c).catch(() => {}); }
  async exportAll() {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await this.sb.from("docs").select("collection,id,data").order("collection").order("id").range(from, from + 999);
      if (error) throw mapErr(error);
      out.push(...data); if (data.length < 1000) break;
    }
    return out;
  }
  async replaceAll(docs) {
    const { error: de } = await this.sb.from("docs").delete().in("collection", COLLECTIONS);
    if (de) throw mapErr(de);
    for (let i = 0; i < docs.length; i += 200) {
      const chunk = docs.slice(i, i + 200).map(d => ({ collection: d.collection, id: d.id, data: d.data, updated_at: new Date().toISOString() }));
      const { error } = await this.sb.from("docs").upsert(chunk);
      if (error) throw mapErr(error);
    }
    this.refresh();
  }
  collection(c) {
    return {
      path: c,
      doc: id => this.doc(c + "/" + (id || rid())),
      onSnapshot: (next, err) => {
        if (!this.listeners.has(c)) this.listeners.set(c, []);
        this.listeners.get(c).push(next);
        this._ensureChannel();
        this._load(c).catch(e => err && err(e));
        return () => { const l = this.listeners.get(c) || []; const i = l.indexOf(next); if (i >= 0) l.splice(i, 1); };
      },
    };
  }
  doc(path) {
    const [c, id] = path.split("/");
    const put = async d => {
      const { error } = await this.sb.from("docs").upsert({ collection: c, id, data: d, updated_at: new Date().toISOString() });
      if (error) throw mapErr(error);
      if (!this.cache.has(c)) this.cache.set(c, new Map());
      this.cache.get(c).set(id, clone(d)); this._emit(c);
    };
    return {
      id, path,
      set: d => put(d),
      update: async d => { const cur = this.cache.get(c) && this.cache.get(c).get(id); if (!cur) throw { code: "invalid_argument", message: "missing" }; return put(deepMerge(clone(cur), d)); },
      delete: async () => {
        const { error } = await this.sb.from("docs").delete().eq("collection", c).eq("id", id);
        if (error) throw mapErr(error);
        const m = this.cache.get(c); if (m) { m.delete(id); this._emit(c); }
      },
    };
  }
}

const writeQueues = new Map();
function write(path, op, data) {
  const prev = writeQueues.get(path) || Promise.resolve();
  const p = prev.catch(() => {}).then(() => {
    const ref = app.DB.doc(path);
    if (op === "set") return ref.set(data);
    if (op === "update") return ref.update(data);
    return ref.delete();
  });
  writeQueues.set(path, p);
  return p.then(() => true, e => { onWriteError(e); return false; });
}
let lastErrToast = 0;
function onWriteError(e) {
  const code = e && e.code;
  if (code === "invalid_argument" && !app.writeKnown) { app.canWrite = false; app.writeKnown = true; render(); }
  if (Date.now() - lastErrToast < 1500) return;
  lastErrToast = Date.now();
  if (code === "quota_exceeded") toast("저장 공간이 가득 찼습니다. 오래된 기록을 지운 뒤 다시 시도하세요");
  else if (code === "invalid_argument") toast("편집 권한이 없습니다. 관리자 비밀번호로 로그인해야 합니다");
  else if (code === "resource_exhausted") toast("요청이 너무 많습니다. 잠시 후 다시 시도하세요");
  else toast("저장하지 못했습니다. 연결을 확인하고 다시 시도하세요");
}
// 여러 문서를 차례로 저장 (동시 쓰기 제한 회피)
async function writeMany(ops, onProgress) {
  let ok = 0, i = 0;
  for (const [path, op, data] of ops) { if (await write(path, op, data)) ok++; onProgress && onProgress(++i, ops.length); }
  return ok;
}

// DB에서 읽은 선수 값 정리 (잘못된 값이 화면 코드에 섞이지 않게)
function cleanPlayer(r) {
  const tid = Number(r.teamId);
  return {
    ...r,
    name: String(r.name).slice(0, 40),
    ingame: typeof r.ingame === "string" ? r.ingame.slice(0, 40) : "",
    tier: Object.prototype.hasOwnProperty.call(TIER, r.tier) ? r.tier : null,
    status: r.status === "present" ? "present" : "absent",
    teamId: Number.isInteger(tid) && tid >= 1 && tid <= 99 ? tid : null,
    imageId: typeof r.imageId === "string" && /^[A-Za-z0-9_-]{1,64}$/.test(r.imageId) ? r.imageId : null,
  };
}
function subscribe() {
  const DB = app.DB;
  const coll = (name, fn) => DB.collection(name).onSnapshot(s => { fn(s.docs.map(d => ({ id: d.id, ...d.data() }))); app.loaded.add(name); onData(); }, e => console.warn(name, e));
  coll("players", rows => { app.players = rows.filter(r => typeof r.name === "string" && r.name.trim()).map(cleanPlayer); app.pmap = new Map(app.players.map(p => [p.id, p])); syncDraftFromDb(); });
  coll("hof", rows => { app.hof = rows.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")); });
  coll("inquiries", rows => { app.inquiries = rows.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")); });
  coll("scores", rows => { app.scores = Object.fromEntries(rows.map(r => [r.id, r.r || {}])); });
  coll("state", rows => { const m = Object.fromEntries(rows.map(r => [r.id, r])); app.st = { draft: m.draft || {}, score: m.score || {}, settings: m.settings || {}, notice: m.notice || {}, rules: m.rules || null, teams: m.teams || {} }; syncDraftFromDb(); maybeShowNotice(); });
}

// 확정된 팀 (players.teamId 기준)
function confirmedTeams() {
  const map = new Map();
  for (const p of app.players) {
    if (!p.teamId) continue;
    if (!map.has(p.teamId)) map.set(p.teamId, { id: p.teamId, members: [] });
    map.get(p.teamId).members.push(p);
  }
  const teams = [...map.values()].sort((a, b) => a.id - b.id);
  teams.forEach(t => { t.members.sort(byTier); t.cost = t.members.reduce((s, p) => s + costOf(p), 0); });
  return teams;
}
/* 점수 규칙: 등수 점수 + 킬 × 킬 점수 + 오브젝트 × 점수 − 규칙 위반 × 감점 */
const DEFAULT_RULES = {
  placement: [10, 7, 5, 4, 3, 2, 1, 0], kill: 1,
  objects: [{ id: "o1", name: "알파", pts: 3 }, { id: "o2", name: "오메가", pts: 5 }, { id: "o3", name: "위클라인", pts: 5 }],
  penalties: [{ id: "v1", name: "지각", pts: 3 }, { id: "v2", name: "비매너 행위", pts: 5 }],
};
const numOr = (v, d) => (v === "" || v == null || !Number.isFinite(Number(v))) ? d : Number(v);
function rules() {
  const r = app.st.rules || {};
  const items = (arr, def) => Array.isArray(arr) ? arr.filter(o => o && /^[A-Za-z0-9_-]{1,40}$/.test(String(o.id))).map(o => ({ id: String(o.id), name: String(o.name || "").slice(0, 30), pts: numOr(o.pts, 0) })) : def;
  return {
    placement: Array.isArray(r.placement) && r.placement.length ? r.placement.map(v => numOr(v, 0)) : DEFAULT_RULES.placement,
    kill: numOr(r.kill, DEFAULT_RULES.kill),
    objects: items(r.objects, DEFAULT_RULES.objects),
    penalties: items(r.penalties, DEFAULT_RULES.penalties),
  };
}
function breakdown(e, ru = rules()) {
  const out = { rank: null, kills: 0, place: 0, kill: 0, obj: 0, pen: 0, total: 0, has: false };
  if (e == null) return out;
  if (typeof e === "number") { out.total = e; out.has = !!e; return out; }
  out.rank = Number(e.rank) || null;
  if (out.rank) out.place = ru.placement[out.rank - 1] ?? 0;
  out.kills = Number(e.kills) || 0; out.kill = out.kills * ru.kill;
  for (const o of ru.objects) out.obj += (Number(e.obj && e.obj[o.id]) || 0) * o.pts;
  for (const v of ru.penalties) out.pen += (Number(e.pen && e.pen[v.id]) || 0) * v.pts;
  out.total = out.place + out.kill + out.obj - out.pen;
  out.has = !!(out.rank || out.kills || Object.values(e.obj || {}).some(Number) || Object.values(e.pen || {}).some(Number));
  return out;
}
const teamScores = id => app.scores["t" + id] || {};
const teamTotal = id => { const ru = rules(); return Object.values(teamScores(id)).reduce((s, e) => s + breakdown(e, ru).total, 0); };
const teamKills = id => Object.values(teamScores(id)).reduce((s, e) => s + (e && typeof e === "object" ? Number(e.kills) || 0 : 0), 0);
function standings() {
  const list = confirmedTeams().map(t => ({ ...t, total: teamTotal(t.id) }));
  list.sort((a, b) => b.total - a.total || a.id - b.id);
  return list;
}
const memberNames = members => members.map(m => m.name).join(", ");

// 기록 통계 (명예의 전당 상세 순위 기반)
function playerStats() {
  const st = new Map();
  const get = (key, name) => { if (!st.has(key)) st.set(key, { key, name, games: 0, wins: 0, rankSum: 0, matches: [] }); const s = st.get(key); if (name) s.name = name; return s; };
  for (const rec of app.hof) {
    (rec.detail || []).forEach((team, idx) => {
      const rank = idx + 1;
      (team.members || []).forEach(m => {
        const s = get(m.id || "name:" + m.name, m.name);
        s.games++; s.rankSum += rank; if (rank === 1) s.wins++;
        s.matches.push({ date: rec.createdAt, title: rec.title, members: memberNames(team.members), rank, total: team.total });
      });
    });
  }
  for (const s of st.values()) { s.avg = s.games ? s.rankSum / s.games : null; s.rate = s.games ? Math.round(s.wins / s.games * 100) : 0; }
  return st;
}
const statFor = (stats, p) => stats.get(p.id) || stats.get("name:" + p.name) || { games: 0, wins: 0, avg: null, rate: 0, matches: [] };

      const empties = Math.max(0, MAX_PER_TEAM - mem.length);

function chipHtml(p, inTeam) {
  return `<div class="chip${draft.sel === p.id ? " sel" : ""}" draggable="true" data-chip="${esc(p.id)}" tabindex="0" role="button" aria-pressed="${draft.sel === p.id}" aria-label="${esc(p.name)} ${tierOf(p).k || "미배정"}">
    ${avatar(p, "sm")}<span class="nm">${esc(p.name)}</span><span class="meta">${tierBadge(p)}<span class="num">(${costOf(p)})</span></span>
    ${inTeam ? `<button type="button" class="x" data-act="to-pool" data-id="${esc(p.id)}" aria-label="${esc(p.name)} 대기실로">${ic("x")}</button>` : ""}</div>`;
}
function moveTo(id, team) {
  if (team) {
    const cnt = draftMembers(team).filter(p => p.id !== id).length;
    if (cnt >= MAX_PER_TEAM) { toast(`한 팀에 최대 ${MAX_PER_TEAM}명까지만 배정할 수 있습니다.`); return false; }
  }
  draft.assign[id] = team || null; draft.dirty = true; return true;
}
function swap(a, b) { const t = draft.assign[a] || null; draft.assign[a] = draft.assign[b] || null; draft.assign[b] = t; draft.dirty = true; }

// 자동 배정: 코스트 높은 순 스네이크 + 랜덤 재시작 + 교환 탐색으로 팀 코스트 합 차이를 최소화
function autoDraft() {
  const ps = present();
  const n = ps.length;
  const k = Math.max(1, Math.ceil(n / MAX_PER_TEAM));
  const sizes = Array.from({ length: k }, (_, i) => Math.floor(n / k) + (i < n % k ? 1 : 0));
  const vals = ps.map(costOf);
  const score = teams => { const sums = teams.map(t => t.reduce((s, i) => s + vals[i], 0)); const mean = sums.reduce((a, b) => a + b, 0) / sums.length; return (Math.max(...sums) - Math.min(...sums)) * 1000 + sums.reduce((s, v) => s + (v - mean) ** 2, 0); };
  const improve = teams => {
    let cur = score(teams), better = true;
    while (better) { better = false;
      for (let a = 0; a < teams.length; a++) for (let b = a + 1; b < teams.length; b++) for (let i = 0; i < teams[a].length; i++) for (let j = 0; j < teams[b].length; j++) {
        const x = teams[a][i], y = teams[b][j]; if (vals[x] === vals[y]) continue;
        teams[a][i] = y; teams[b][j] = x; const s = score(teams);
        if (s < cur - 1e-9) { cur = s; better = true; } else { teams[a][i] = x; teams[b][j] = y; }
      } }
    return cur;
  };
  const shuffled = () => { const idx = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; };
  const snake = () => {
    const order = shuffled().sort((a, b) => vals[b] - vals[a]);
    const teams = sizes.map(() => []); let t = 0, dir = 1;
    for (const i of order) { let guard = 0; while (teams[t].length >= sizes[t] && guard++ < 2 * k) { t += dir; if (t < 0 || t >= k) { dir = -dir; t += dir; } } teams[t].push(i); t += dir; if (t < 0 || t >= k) { dir = -dir; t += dir; } }
    return teams;
  };
  const tries = n <= 30 ? 120 : 40;
  let best = null, bestS = Infinity, ties = [];
  for (let r = 0; r < tries; r++) {
    let teams;
    if (r === 0) teams = snake();
    else { const idx = shuffled(); teams = []; let o = 0; for (const s of sizes) { teams.push(idx.slice(o, o + s)); o += s; } }
    const s = improve(teams);
    if (s < bestS - 1e-9) { bestS = s; ties = [teams]; } else if (Math.abs(s - bestS) < 1e-9) ties.push(teams);
  }
  best = ties[Math.floor(Math.random() * ties.length)];
  // 팀 번호도 섞어서 매번 다른 배치
  const teamOrder = [...best.keys()].sort(() => Math.random() - .5);
  draft.assign = {};
  teamOrder.forEach((ti, pos) => best[ti].forEach(i => { draft.assign[ps[i].id] = pos + 1; }));
  setTeamCount(k);
  draft.dirty = true; draft.sel = null;
  const sums = best.map(t => t.reduce((s, i) => s + vals[i], 0));
  const small = sizes.filter(s => s < MAX_PER_TEAM).length;
  toast(`${k}팀 자동 배정 · 코스트 차이 ${Math.max(...sums) - Math.min(...sums)}${small ? ` · ${small}팀은 ${Math.min(...sizes)}명` : ""}`);
}
async function saveDraft() {
  const ops = [];
  for (const p of app.players) {
    const want = p.status === "present" ? (draft.assign[p.id] || null) : null;
    if ((p.teamId || null) !== want) ops.push(["players/" + p.id, "update", { teamId: want }]);
  }
  ops.push(["state/draft", "set", { teamCount: draft.teamCount, savedAt: new Date().toISOString() }]);
  const btn = $('[data-act="draft-save"]'); if (btn) { btn.disabled = true; btn.innerHTML = `${ic("save")}저장 중…`; }
  const ok = await writeMany(ops);
  if (ok === ops.length) { draft.dirty = false; toast("팀 배치가 저장되었습니다! 점수판에서 확인하세요."); }
  render();
}
function draftText() {
  let s = " [팀 구성 현황]\n\n";
  for (let n = 1; n <= draft.teamCount; n++) { const m = draftMembers(n); if (m.length) s += ` ${teamName(n)}: ${m.map(p => p.name).join(", ")}  (코스트 ${m.reduce((a, p) => a + costOf(p), 0)})\n`; }
  return s;
}

    return `<div class="score-layout">
      <section class="panel"><div class="panel-head"><h3>${ic("trophy")}실시간 순위</h3><span class="muted" style="font-size:12px">총점순 자동 정렬</span></div>

          <th class="r">R${R} 점수</th></tr></thead><tbody>

        </tbody></table></div>
        <p class="muted" style="font-size:12px;margin:0;padding:10px 16px 14px">오브젝트와 규칙 위반은 횟수를 입력하세요. 점수는 아래 <b>점수 규칙</b>에 따라 자동 계산되고, 입력하는 즉시 저장됩니다.${hidden ? ` 점수가 0인 항목 ${hidden}개는 숨겨져 있습니다.` : ""}</p></section>

function setField(team, f, raw) {
  const R = String(scoreUI.round);
  const cur = JSON.parse(JSON.stringify(teamScores(team)));
  let e = cur[R];
  if (!e || typeof e !== "object") e = {};
  const v = raw === "" ? 0 : Math.max(0, Math.floor(Number(raw)));
  if (!Number.isFinite(v)) return;
  if (f === "rank") { if (v) e.rank = v; else delete e.rank; }
  else if (f === "kills") { if (v) e.kills = v; else delete e.kills; }
  else {
    const bucket = f.startsWith("o-") ? "obj" : "pen", key = f.slice(2);
    e[bucket] = { ...(e[bucket] || {}) };
    if (v) e[bucket][key] = v; else delete e[bucket][key];
    if (!Object.keys(e[bucket]).length) delete e[bucket];
  }
  if (Object.keys(e).length) cur[R] = e; else delete cur[R];
  app.scores["t" + team] = cur;
  write("scores/t" + team, "set", { r: cur });
}

async function exportBackup() {
  try {
    const docs = await app.DB.exportAll();
    const blob = new Blob([JSON.stringify({ app: "naejeon-manager", version: 1, exportedAt: new Date().toISOString(), docs }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    const d = new Date(), pad = n => String(n).padStart(2, "0");
    a.href = URL.createObjectURL(blob);
    a.download = `naejeon-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(`백업 파일을 받았습니다 (${docs.length}개 항목)`);
  } catch (e) { toast("백업하지 못했습니다. 다시 로그인한 뒤 시도하세요"); }
}
async function importBackup(file) {
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) return toast("파일이 너무 큽니다");
  let json;
  try { json = JSON.parse(await file.text()); } catch { return toast("백업 파일을 읽지 못했습니다"); }
  const docs = json && json.app === "naejeon-manager" && Array.isArray(json.docs) ? json.docs : null;
  if (!docs) return toast("이 사이트의 백업 파일이 아닙니다");
  const valid = docs.filter(d => d && COLLECTIONS.includes(d.collection) && DOC_ID_RE.test(String(d.id)) && d.data && typeof d.data === "object" && !Array.isArray(d.data) && JSON.stringify(d.data).length < 250000);
  if (!valid.length) return toast("백업 파일에 되돌릴 내용이 없습니다");
  const when = json.exportedAt ? new Date(json.exportedAt).toLocaleString("ko-KR") : "알 수 없음";
  if (!await confirmBox(`${when} 백업으로 되돌릴까요?\n\n지금 데이터가 모두 지워지고 백업의 ${valid.length}개 항목으로 바뀝니다.${valid.length < docs.length ? `\n(형식이 맞지 않는 ${docs.length - valid.length}개 항목은 건너뜁니다)` : ""}\n되돌린 뒤에는 취소할 수 없습니다.`, { ok: "되돌리기", danger: true, title: "백업으로 되돌리기" })) return;
  try { toast("되돌리는 중…"); await app.DB.replaceAll(valid); draft.dirty = false; tierUI.pending = {}; rulesDraft = null; toast("백업 시점으로 되돌렸습니다"); }
  catch (e) { toast("되돌리지 못했습니다. 관리자 비밀번호로 다시 로그인한 뒤 시도하세요"); }
}

/* ── 사이트 아이콘 이미지: 128px 정사각형으로 줄여 data URL로 저장 ── */
function loadBrandImage(file) {
  if (!file) return;
  if (!file.type.startsWith("image/")) { toast("이미지 파일만 올릴 수 있습니다"); return; }
  if (file.size > 15 * 1024 * 1024) { toast("15MB 이하 이미지만 올릴 수 있습니다"); return; }
  const reader = new FileReader();
  reader.onerror = () => toast("이미지를 읽지 못했습니다");
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => toast("이 이미지는 열 수 없습니다. PNG나 JPG로 다시 시도하세요");
    img.onload = () => {
      const S = 128, c = document.createElement("canvas"); c.width = c.height = S;
      const g = c.getContext("2d");
      const w = img.naturalWidth || S, h = img.naturalHeight || S, side = Math.min(w, h);
      g.imageSmoothingQuality = "high";
      g.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, S, S);  // 가운데를 정사각형으로 자름
      let url = c.toDataURL("image/webp", 0.9);
      if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/png");
      if (url.length > 200000) url = c.toDataURL("image/jpeg", 0.85);
      setUI.icon = "img:" + url;
      render();
      toast("미리보기에 적용했습니다. 저장을 눌러야 반영됩니다");
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ════════════════════════ 이벤트 ════════════════════════ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  // 드래프트 / 티어표의 '선택 후 옮기기' 처리
  if (!el || el.dataset.act === "slot") {
    if (app.route === "draft" && handleDraftClick(e)) return;
    if (app.route === "tiers" && handleTierClick(e)) return;
    if (!el) return;
  }
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case "nav": go(el.dataset.r); break;
    case "theme": { const next = currentTheme() === "dark" ? "light" : "dark"; ls.set("nj-theme", next); applyTheme(); render(); break; }
    case "modal-bg": if (e.target === el) closeModal(); break;
    case "modal-close": closeModal(); break;
    case "modal-ok": closeModal(true); break;
    case "notice-forever": ls.set("nj-notice-seen", app.st.notice.version); closeModal(); break;

    case "att-toggle": {
      const p = app.pmap.get(id); if (!p || !app.canWrite) return;
      const status = p.status === "present" ? "absent" : "present";
      p.status = status; render();
      write("players/" + id, "update", { status });

// 강력한 비밀번호 만들기: 헷갈리는 글자(0/O, 1/l) 빼고 14자
function strongPassword() {

}
function weakReason(pw) {
  if (pw.length < 10) return "비밀번호는 10자 이상이어야 합니다";
  if (/^\d+$/.test(pw)) return "숫자로만 된 비밀번호는 쓸 수 없습니다";
  if (/^(.)\1+$/.test(pw)) return "같은 글자만 반복된 비밀번호는 쓸 수 없습니다";
  if (/^(password|qwerty|abc123|1q2w3e|asdf|admin|naejeon|eternal)/i.test(pw)) return "너무 흔한 비밀번호입니다";
  return "";
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "logout") { await SB.auth.signOut(); location.reload(); }
  if (act === "copy-url") copyText(location.origin + location.pathname);
  if (act === "pw-gen") {
    const r = el.dataset.r, v = strongPassword();
    const a = $(`#pw${r}New`), b = $(`#pw${r}New2`);
    a.value = b.value = v; a.type = b.type = "text";
    toast("만든 비밀번호를 따로 적어둔 뒤 변경 버튼을 누르세요");
  }
  if (act === "pw-admin" || act === "pw-viewer") {
    const role = act === "pw-admin" ? "admin" : "viewer";
    const a = $(role === "admin" ? "#pwAdminNew" : "#pwViewNew").value, b = $(role === "admin" ? "#pwAdminNew2" : "#pwViewNew2").value;
    const weak = weakReason(a); if (weak) return toast(weak);
    if (a !== b) return toast("새 비밀번호 두 칸이 서로 다릅니다");
    if (!await confirmBox(role === "admin" ? "관리자 비밀번호를 바꿀까요?\n다른 곳에 로그인된 관리자는 모두 로그아웃됩니다." : "보기용 비밀번호를 바꿀까요?\n기존 비밀번호로 접속한 사람은 모두 로그아웃됩니다.", { ok: "바꾸기" })) return;
    el.disabled = true;
    const { error } = await SB.rpc("set_member_password", { p_role: role, p_password: a });
    el.disabled = false;
    if (error) return toast(/same/i.test(error.message) ? "보기용과 관리자 비밀번호는 서로 달라야 합니다" : /short|weak/i.test(error.message) ? "더 강한 비밀번호를 쓰세요 (10자 이상, 숫자만은 안 됨)" : "바꾸지 못했습니다. 관리자 비밀번호로 다시 로그인한 뒤 시도하세요");
    $$("#pwAdminNew, #pwAdminNew2, #pwViewNew, #pwViewNew2").forEach(x => x.value = "");
    toast(role === "admin" ? "관리자 비밀번호를 바꿨습니다" : "보기용 비밀번호를 바꿨습니다. 기존 접속자는 곧 로그아웃됩니다");
  }
});

(async () => {
  const configured = CFG.supabaseUrl && CFG.supabaseAnonKey && !/YOUR|여기에/.test(CFG.supabaseUrl + CFG.supabaseAnonKey) && window.supabase;
  if (!configured) {
    // 설정 전: 이 브라우저에만 저장되는 미리보기
    app.DB = new LocalDB("nj-local-db-v1"); app.mode = "local"; app.canWrite = true; app.writeKnown = true;
    const h = (location.hash || "").replace("#", "");
    if (PAGES[h]) app.route = h;
    subscribe(); render();
    setTimeout(() => toast("미리보기 모드: config.js 설정 전이라 이 브라우저에만 저장됩니다"), 600);
    return;
  }
  SB = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "nj-auth" } });
  SB.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && app.mode === "db") location.reload(); });
  const { data } = await SB.auth.getSession();
  if (data && data.session) startWithSession(); else showLogin();
})();
})();
</script>
